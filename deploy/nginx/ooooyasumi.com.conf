server
{
    listen 80;
    server_name ooooyasumi.com www.ooooyasumi.com;

    root /www/wwwroot/ooooyasumi.com;
    index index.html;

    # 禁止访问 Next.js 内部文件
    location ~ ^/__next {
        deny all;
    }

    # Next.js 静态导出配置
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /www/wwwlogs/ooooyasumi.com.log;
    error_log /www/wwwlogs/ooooyasumi.com.error.log;
}
